.layout-atom .k-title { font-size: clamp(1.31rem, 6.85cqw, 1.96rem); }
.layout-atom :is(.kind-element, .element-study) { display: contents; }
.layout-atom :is(.atom-figure, .k-lead, .k-credit) { grid-column: 1 / -1; }
.layout-atom .element-plate {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  justify-items: start;
  min-height: 0;
  gap: .21rem;
  padding: .5rem .56rem;
  background: var(--surface);
  border: 0;
  border-radius: 5px;
}
.layout-atom .element-number { color: var(--subtle); font: 600 .79rem/1.2 var(--mono); }
.layout-atom .element-plate b { font: 630 clamp(1.65rem, 8cqw, 2.25rem)/1 var(--font); }
.layout-atom .element-plate span:last-child {
  color: var(--subtle);
  font-size: .74rem;
  line-height: 1.22;
  text-align: start;
}
.layout-atom .atom-figure {
  border: 0;
  border-block: 1px solid var(--line);
  border-radius: 0;
  padding: .8rem 0 .9rem;
}
.layout-atom .atom-layout {
  grid-template-columns: minmax(0, 1.4fr) minmax(90px, 1fr);
  gap: .75rem;
  margin: .55rem 0;
}
.layout-atom .atom-layout .diagram { width: min(100%, 176px); }
.layout-atom .diagram .nucleus-label { font-size: 16px; }
.layout-atom .diagram:not(:has(.shell ~ .shell)) :is(.shell, .electron) {
  transform-origin: center;
  transform: scale(1.42);
}
.layout-atom .shell-key li { border-bottom: 0; padding: 0; line-height: 1.3; }
.layout-atom .shell-key b { color: var(--ink); }
.layout-atom .atom-note { font-size: .8rem; line-height: 1.45; }

/* Verse is typeset as text, with the interpretation outside the poem. */
.knowledge-card blockquote { margin: 0; }
:is(.layout-verse, .layout-lyric) .k-title { font-family: var(--serif-cn); }
:is(.layout-verse, .layout-lyric) blockquote {
  font: 500 clamp(1.05rem, 5.4cqw, 1.33rem)/1.86 var(--serif-cn);
  text-wrap: pretty;
}
.layout-verse :is(.k-head, .k-source-text) { text-align: center; }
.layout-lyric .k-source-text { padding-inline-start: .72rem; border-inline-start: 1px solid #c8cbd0; }
.k-verse-line { display: block; }
.layout-lyric .k-verse-line { padding-inline-start: 1em; text-indent: -1em; }
.k-byline { margin-bottom: .85rem; font-size: .86rem; color: var(--subtle); }
:is(.layout-verse, .layout-lyric, .layout-reading) .k-lead { padding-top: .85rem; border-top: 1px solid var(--line); }
.layout-reading .k-title { font-family: var(--display); }
.layout-reading .k-source-text { font: 1.105rem/1.55 var(--display); }

/* Reproductions and identification plates retain their full subject. */
.knowledge-card .frame {
  border: 0;
  border-radius: 5px;
  background: var(--surface);
}
.knowledge-card .frame img { width: 100%; object-fit: contain; background: var(--surface); }
.knowledge-card .frame figcaption { padding: .4rem 0 0; }
.layout-gallery .frame img { height: clamp(8.4rem, 67cqw, 18rem); }
.layout-gallery .k-title, .layout-field .k-title { font-family: var(--display); }
.k-scientific {
  display: block;
  color: var(--subtle);
  font: italic 400 .98rem/1.4 var(--display);
  letter-spacing: 0;
  margin-top: .22em;
}
.layout-gallery:not(.breed-portrait) .k-lead { font-size: .91rem; color: var(--subtle); }
.layout-field .photos:not(.paired) img { aspect-ratio: 4 / 3; }
.layout-field .photos:not(.paired) { margin-inline: calc(-1 * var(--inset)); }
.layout-field .photos:not(.paired) .frame { border-radius: 0; }
.layout-field .photos.paired { gap: .7rem; }
.layout-field:not(.breed-profile) .k-lead { font-size: .91rem; color: var(--subtle); }
.specimen { margin: 0; }
.specimen img {
  display: block;
  width: 100%;
  height: clamp(9rem, 64cqw, 20rem);
  padding: .35rem;
  object-fit: contain;
  background: #f7f5ef;
  border: 1px solid #e9e5dc;
  border-radius: 6px;
}
.specimen figcaption {
  display: flex;
  flex-wrap: wrap;
  gap: .15em .6em;
  padding-top: .45em;
  color: var(--subtle);
  font-size: .81rem;
}
.specimen figcaption span:first-child { font-weight: 625; }
.breed-portrait .kind-illustration { margin: calc(-1 * var(--inset)) calc(-1 * var(--inset)) 0; }
.breed-portrait .specimen img {
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 12px 12px 0 0;
  padding: .45rem .5rem 0;
  height: clamp(11rem, 75cqw, 20rem);
}
.breed-portrait .specimen figcaption { padding-inline: var(--inset); }
